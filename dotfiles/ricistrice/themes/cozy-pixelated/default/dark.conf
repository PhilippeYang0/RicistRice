# cozy-pixelated / default / dark
#
# Palette format (read by ../../../bin/theme.sh): "key value" per line, # starts
# a comment, colours are rrggbb without the #.
#
# Settings:
#   seed        accent colour matugen builds every Material role from, or
#               "wallpaper" to take it from the current wallpaper instead
#   variant     default Material variant (tonalspot, vibrant, expressive,
#               fidelity, content, fruitsalad, rainbow, neutral, monochrome);
#               the launcher's ">variant" overrides it until the theme changes
#   prefer      with "seed wallpaper": which image colour matugen picks
#               (saturation, darkness, lightness, less-saturation, value)
#   filter      awww scaling filter: Nearest keeps pixel art crisp;
#               Lanczos3 (the default) suits photos and paintings
#   transition  awww transition: simple, fade, wipe, wave, grow, outer, ...
#
# Anything else pins that colour role over matugen's output. Role names are
# the ones in ~/.local/state/caelestia/scheme.json (primary, surfaceContainer,
# onSurfaceVariant, success, ...). Pin the parts that make the theme; leave
# the rest to matugen.

seed        d9a05b      # honey amber, like lamplight on wood
variant     tonalspot
filter      Nearest
transition  grow

# Warm wood-brown surfaces instead of matugen's near-neutral greys
background               1c1714
surface                  1c1714
surfaceDim               1c1714
surfaceBright            3f3530
surfaceContainerLowest   16110f
surfaceContainerLow      241e1a
surfaceContainer         29221e
surfaceContainerHigh     342c27
surfaceContainerHighest  3f3631

# Cream text, parchment-toned secondary text and outlines
onBackground             f0e2d0
onSurface                f0e2d0
onSurfaceVariant         d5c3ad
outline                  9e8c78
outlineVariant           51453a

# Mossy green for "done/ok" states
success                  a9c98f
onSuccess                1f3512
successContainer         354c26
onSuccessContainer       c5e6aa
