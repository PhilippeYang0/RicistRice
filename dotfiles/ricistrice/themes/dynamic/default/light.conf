# dynamic / default / light
#
# Not a curated theme: every colour comes from the current wallpaper, like
# caelestia's "dynamic" scheme. It stays on while wallpapers change, even when
# the wallpaper sits in another theme's folder; pick a theme in >scheme to
# leave it. With the shell's "Smart colour scheme" setting on, each wallpaper
# also picks the mode (dark.conf or this file) and the variant (see
# smart_opts in ../../../bin/theme.sh). Format: see cozy-pixelated/default/dark.conf.
#
# No colour roles are pinned: pinning one would stop it following the wallpaper.

seed        wallpaper
variant     tonalspot   # used when smart scheme is off
prefer      saturation  # the wallpaper's most colourful candidate sets the hue
