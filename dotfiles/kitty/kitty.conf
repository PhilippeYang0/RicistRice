# RicistRice kitty config. Every option: `kitty +runpy 'from kitty.config import *; print(commented_out_default_config())' | less`
# or https://sw.kovidgoyal.net/kitty/conf/. Save, then Ctrl+Shift+F5 reloads
# it in every open window (theme.sh does the same with SIGUSR1).

# --- Font --------------------------------------------------------------------
font_family      CaskaydiaCove NF
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0
# Ctrl+Shift+Equal / Ctrl+Shift+Minus change the size, Ctrl+Shift+Backspace resets

# --- Look --------------------------------------------------------------------
# See-through background: kitty fades only the background, so text stays
# solid, and Hyprland blurs the wallpaper behind it (hypr rules tag kitty
# "opaque" so Hyprland doesn't fade the window a second time).
background_opacity         0.78
# Ctrl+Shift+A then M / L changes the opacity live, R resets
dynamic_background_opacity yes

window_padding_width 12
hide_window_decorations yes
confirm_os_window_close 0

cursor_shape     beam
cursor_beam_thickness 1.8
cursor_blink_interval 0.6
# A short comet tail when the cursor jumps (0 turns it off)
cursor_trail 3

# Tabs (Ctrl+Shift+T new, Ctrl+Shift+Left/Right switch) and splits
tab_bar_edge      bottom
tab_bar_style     powerline
tab_powerline_style round
tab_title_template "{index}: {title}"
enabled_layouts   splits, stack

# --- Behaviour ---------------------------------------------------------------
scrollback_lines 10000
enable_audio_bell no
visual_bell_duration 0.0
copy_on_select no
strip_trailing_spaces smart
url_style curly
detect_urls yes

# Splits: Ctrl+Shift+Enter opens one beside, Ctrl+Shift+\ one below
map ctrl+shift+enter launch --location=vsplit --cwd=current
map ctrl+shift+backslash launch --location=hsplit --cwd=current
map ctrl+shift+z toggle_layout stack

# --- Colours -----------------------------------------------------------------
# Fallback, used only until theme.sh has run once; the include below (written
# by ricistrice theme.sh from the current theme) overrides it.
foreground #f0e2d0
background #1c1714

include ${HOME}/.local/state/ricistrice/kitty-colours.conf
