source = ~/.config/hypr/monitors.conf

# Autostart essentials
exec-once = waybar
exec-once = hyprpaper

# Basic keybinds (Hyprland default modifier is usually SUPER)
$mainMod = SUPER

bind = $mainMod, Return, exec, alacritty          # open terminal (swap kitty for your terminal if different)
bind = $mainMod, D, exec, rofi -show drun # app launcher
bind = $mainMod, Q, killactive            # close window
bind = $mainMod, V, togglefloating        # toggle floating/tiling
bind = $mainMod, F, fullscreen
bind = $mainMod, M, exit                  # logs out of Hyprland

# Move focus between windows
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

cursor {
	no_hardware_cursors = true
}
